# ============================================================================
# Quackback — production stack (self-hosting)
# ============================================================================
# Meshfield fork note: the upstream MinIO + minio-init services were removed
# here because MinIO Inc. gated all their container images (Docker Hub *and*
# quay.io, including old pinned tags) behind a required login in 2025. This
# fork points S3_* at Backblaze B2 instead, reusing the same offsite-storage
# provider already used for Meshfield's backups (separate bucket + dedicated,
# bucket-scoped application key — not the shared backup credentials).
#
# Everything else is unchanged from upstream docker-compose.prod.yml (v0.13.2).
# ============================================================================

services:
  app:
    image: ghcr.io/quackbackio/quackback:${QUACKBACK_TAG:-latest}
    container_name: quackback-app
    restart: unless-stopped
    init: true
    # Carries BASE_URL, SECRET_KEY, email settings, S3_* (B2), etc.
    env_file: .env
    environment:
      # POSTGRES_PASSWORD_URLENC must be the percent-encoded form of
      # POSTGRES_PASSWORD (e.g. '/' -> '%2F') — Compose does not URL-encode
      # values, and an unencoded special character here breaks the app's own
      # URL parser at startup even though Postgres itself accepts the raw
      # password fine.
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD_URLENC:?set POSTGRES_PASSWORD_URLENC in .env}@postgres:5432/${POSTGRES_DB:-quackback}
      REDIS_URL: redis://dragonfly:6379
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-eu-central-003}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_FORCE_PATH_STYLE: 'true'
      # Serve uploads through the app's /api/storage proxy rather than exposing
      # the bucket directly to the browser.
      S3_PROXY: 'true'
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quackback}
    # No host port — Postgres is reachable only on the internal network.
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql
    # pg_cron is required for scheduled analytics/materialized-view refreshes.
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=${POSTGRES_DB:-quackback} -c max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  # Nightly logical pg_dump -> Backblaze B2, separate from the live postgres
  # volume (a raw tar of a running Postgres data dir is not crash-consistent —
  # this uses pg_dump instead, per Coolify's own backup guidance).
  postgres-backup:
    image: eeshugerman/postgres-backup-s3:latest
    container_name: quackback-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCHEDULE: ${PG_BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${PG_BACKUP_KEEP_DAYS:-14}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DATABASE: ${POSTGRES_DB:-quackback}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      S3_ENDPOINT: ${PG_BACKUP_S3_ENDPOINT:?set PG_BACKUP_S3_ENDPOINT in .env}
      S3_REGION: ${PG_BACKUP_S3_REGION:-eu-central-003}
      S3_BUCKET: ${PG_BACKUP_S3_BUCKET:?set PG_BACKUP_S3_BUCKET in .env}
      S3_PREFIX: ${PG_BACKUP_S3_PREFIX:-quackback}
      S3_ACCESS_KEY_ID: ${PG_BACKUP_S3_ACCESS_KEY_ID:?set PG_BACKUP_S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${PG_BACKUP_S3_SECRET_ACCESS_KEY:?set PG_BACKUP_S3_SECRET_ACCESS_KEY in .env}

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    container_name: quackback-dragonfly
    restart: unless-stopped
    # BullMQ requires cluster_mode=emulated + lock_on_hashtags for Lua script compatibility.
    command: dragonfly --cluster_mode=emulated --lock_on_hashtags
    # No host port — reachable only on the internal network.
    volumes:
      - dragonfly_data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  dragonfly_data:
